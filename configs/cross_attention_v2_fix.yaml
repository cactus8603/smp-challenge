base: base.yaml

exp_name: smp_v2_fasttext_geoB_residual_cross_v2_ftmeta_gatedres

train:
  batch_size: 512
  lr: 0.00015
  meta_warmup_epochs: 1

fusion:
  type: residual_cross_attention
  # Feature-level fusion, no MoE/expert competition.
  order: text_meta_first          # alternatives: text_meta_first, image_meta_first
  use_clip_similarity: true
  clip_similarity_mode: both      # raw CLIP sim + projected sim, extra_dim=2
  num_heads: 4
  text_res_scale: 0.50
  meta_res_scale: 1.20
  image_res_scale: 0.50
  tm_res_scale: 0.75

model:
  head_type: regression
  head_hidden_mult: 1.5
  head_num_layers: 3
  dropout: 0.1

  # Independent metadata prediction path used also by meta-only warmup.
  use_meta_aux_head: true
  meta_aux_scale: 0.20

  # Gated residual injection:
  # fused = fused + sigmoid(gate) * LN(Linear(meta_feat))
  use_meta_residual: true
  meta_residual_init: 0.0        # sigmoid(0)=0.5, half-open at start
  meta_residual_dropout: 0.0

meta:
  branch_dim: 128
  encoder_type: ft_transformer
  use_semantic_groups: false

  # FT-Transformer metadata encoder.
  # ~60-90 feature tokens + CLS; 192/8/3 is stronger than the earlier 64/4/2.
  ft_token_dim: 192
  ft_num_layers: 3
  ft_num_heads: 8
  ft_ffn_mult: 2
  ft_dropout: 0.1

  # Dense user_desc branch is disabled for this architecture test.
  # user_desc_lite metadata features remain enabled in preprocess.
  use_user_desc: false
  user_desc_dim: 768
  desc_bottleneck_dim: 64
  user_desc_scale: 0.0
  use_loc_desc: false
  loc_desc_scale: 0.0

user_desc_encoder:
  enabled: false
  mode: sentence_transformers
  model_name: sentence-transformers/all-mpnet-base-v2
  uid_col: Uid
  text_col: user_description_clean
  fallback_text_col: user_description
  output_dim: 768
  batch_size: 128
  normalize_embeddings: true
  max_chars: 1024
  cache_dir: /local/smp/processed_v2/embeddings/hf_user_desc
  cache_name: all_mpnet_base_v2_user_desc
  force_rebuild: false
  device: null

preprocess:
  # Smoothed target encoding for country/state/city/location_text.
  # Train rows use leave-one-out; val/test use fold-train stats.
  target_encoding_smoothing: 30.0
  use_user_desc_lite: true
  user_desc_lite_debug: true

tag_embedding:
  use: true
  type: vec
  source: vec
  language: en
  vec_path: /local/smp/fasttext/wiki-news-300d-1M.vec
  cache_dir: /local/smp/fasttext
  cache_path: /local/smp/fasttext/fasttext_en_300k_cache.pt
  max_vectors: 300000
  trainable: false
  normalize_output: false

loss:
  name: hybrid
  alpha: 1.0
  beta: 0.45
  gamma: 0.18
  delta: 0.25
  eta: 0.12
  zeta: 0.15
  hard_scale: 1.2
  high_target_scale: 0.35
  reg_max_weight: 4.0
  min_target_diff: 0.15
  rank_max_weight: 4.0
  variance_floor_ratio: 0.70
  focal_gamma: 1.3

monitor:
  gbdt: false

seed: 42
exp_name: base_exp
data:
  official_train_path: /local/smp/processed_v2/official_train.parquet
  loc_desc_emb_path: null
  loc_desc_idx_path: null
user_desc_encoder:
  enabled: false
  mode: sentence_transformers
  model_name: sentence-transformers/all-mpnet-base-v2
  uid_col: Uid
  text_col: user_description_clean
  fallback_text_col: user_description
  output_dim: 768
  batch_size: 128
  normalize_embeddings: true
  max_chars: 1024
  cache_dir: /local/smp/processed_v2/embeddings/hf_user_desc
  cache_name: all_mpnet_base_v2_user_desc
  force_rebuild: false
  device: null
model:
  use_text: true
  use_meta: true
  use_image: true
  hidden_dim: 256
  dropout: 0.1
  head_type: moe
text:
  model_name: openai/clip-vit-base-patch32
  max_length: 77
  pooling: clip
  trainable: false
  use_caption: false
  caption_max_freq: 50
image:
  path_col: image_path
  model_name: openai/clip-vit-base-patch32
  pretrained: true
  trainable: false
  root_dir: /local/smp/data
  normalize_feature: false
meta:
  branch_dim: 128
  use_semantic_groups: false
  use_user_desc: false
  user_desc_scale: 0.0
  user_desc_dim: 768
  desc_bottleneck_dim: 32
  use_loc_desc: false
  loc_desc_scale: 0.0
  loc_desc_dim: 400
fusion:
  type: pairwise_gated
  use_clip_similarity: true
  clip_similarity_mode: raw
tag_embedding:
  use: true
  type: fasttext
  vec_path: null
  cache_path: null
  max_vectors: 300000
  trainable: false
  normalize_output: false
loss:
  name: hybrid
  alpha: 1.0
  beta: 0.45
  gamma: 0.18
  delta: 0.6
  eta: 0.35
  zeta: 0.15
  hard_scale: 1.2
  high_target_scale: 0.6
  reg_max_weight: 4.0
  min_target_diff: 0.15
  rank_max_weight: 4.0
  variance_floor_ratio: 0.85
  focal_gamma: 1.3
train:
  batch_size: 512
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  drop_last: false
  epochs: 24
  lr: 0.00015
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_ratio: 0.1
output:
  root_dir: outputs
preprocess:
  num_cols: null
  cat_cols: null
  bin_cols: null
  log1p_cols: null
  normalize_numeric: true
  use_user_desc_lite: true
  user_desc_lite_debug: true
  user_desc_lite_max_keywords: 5
monitor:
  gbdt: false
  gbdt_interval: 1
  gbdt_max_train_batches: 80
  gbdt_max_val_batches: null
code_snapshot:
  enabled: true

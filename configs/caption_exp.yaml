seed: 42
exp_name: caption_exp

data:
  # Use caption-enriched parquet (generated by merge_captions_to_parquet.py)
  official_train_path: /ssd1/lchiayu/smp-challenge/data/processed_v2/official_train_cap.parquet
  user_desc_emb_path: /ssd1/lchiayu/smp-challenge/data/processed_v2/embeddings/user_desc_embeddings.npy
  user_desc_idx_path: /ssd1/lchiayu/smp-challenge/data/processed_v2/embeddings/user_desc_uid_index.json

model:
  use_text: true
  use_meta: true
  use_image: true
  hidden_dim: 256
  dropout: 0.1

text:
  model_name: openai/clip-vit-base-patch32
  max_length: 77
  pooling: clip
  trainable: false

image:
  model_name: openai/clip-vit-base-patch32
  pretrained: true
  trainable: false
  root_dir: /ssd1/lchiayu/smp-challenge/data/official_data/train_set

meta:
  branch_dim: 128
  desc_bottleneck_dim: 64

fusion:
  type: pairwise_gated
  use_clip_similarity: true

loss:
  name: hybrid

train:
  batch_size: 256
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  drop_last: false
  epochs: 24
  lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip_norm: 1.0
  warmup_ratio: 0.1

output:
  root_dir: outputs

preprocess:
  num_cols: null
  cat_cols: null
  bin_cols: null
  log1p_cols: null

monitor:
  gbdt: true
  gbdt_interval: 1
  gbdt_max_train_batches: 80
  gbdt_max_val_batches: null

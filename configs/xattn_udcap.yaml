base: base_xattn.yaml

exp_name: xattn_udcap_residual_meta_text

train:
  batch_size: 512
  epochs: 12
  lr: 0.00015
  meta_warmup_epochs: 1
  early_stop_patience: 2
  early_stop_min_delta: 0.001

diagnostics:
  ablation_spearman_threshold: 0.62
  ablation_on_best_only: true

fusion:
  type: residual_cross_attention
  order: text_meta_first
  use_clip_similarity: true
  clip_similarity_mode: both
  num_heads: 4
  text_res_scale: 0.50
  meta_res_scale: 1.20
  image_res_scale: 0.50
  tm_res_scale: 0.75

model:
  head_type: regression
  head_hidden_mult: 1.5
  head_num_layers: 3
  dropout: 0.12
  use_meta_aux_head: true
  meta_aux_scale: 0.20
  use_meta_residual: true
  meta_residual_init: 0.0
  meta_residual_dropout: 0.05

meta:
  branch_dim: 128
  encoder_type: ft_transformer
  use_semantic_groups: false
  ft_token_dim: 192
  ft_num_layers: 3
  ft_num_heads: 8
  ft_ffn_mult: 2
  ft_dropout: 0.12
  use_user_desc: false
  user_desc_dim: 768
  desc_bottleneck_dim: 64
  user_desc_scale: 0.0
  use_loc_desc: false
  loc_desc_scale: 0.0

user_desc_encoder:
  enabled: false
  cache_dir: "${SMP_ROOT:-/local/smp}/processed_v3/embeddings/hf_user_desc"

preprocess:
  target_encoding_smoothing: 30.0
  use_label_user_aggregates: false
  cache_static_fields: false
  use_user_desc_lite: true
  user_desc_lite_debug: true

tag_embedding:
  use: true
  type: vec
  source: vec
  language: en
  vec_path: "${SMP_ROOT:-/local/smp}/fasttext/wiki-news-300d-1M.vec"
  cache_dir: "${SMP_ROOT:-/local/smp}/fasttext"
  cache_path: "${SMP_ROOT:-/local/smp}/fasttext/fasttext_en_300k_cache.pt"
  max_vectors: 300000
  trainable: false
  normalize_output: false

loss:
  name: hybrid
  alpha: 1.0
  beta: 0.45
  gamma: 0.18
  delta: 0.25
  eta: 0.12
  zeta: 0.15
  hard_scale: 1.2
  high_target_scale: 0.35
  reg_max_weight: 4.0
  min_target_diff: 0.15
  rank_max_weight: 4.0
  rank_max_pairs: 65536
  contrast_max_pairs: 65536
  variance_floor_ratio: 0.70
  focal_gamma: 1.3

monitor:
  gbdt: false
  gbdt_interval: 2
  gbdt_max_train_batches: 80
  gbdt_max_val_batches: null

text:
  use_caption: false
  caption_max_freq: 50
